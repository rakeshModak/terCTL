name: Release

# Builds installers for macOS, Linux, and Windows and attaches them to a draft
# GitHub Release. Trigger by pushing a version tag (e.g. `git tag v1.0.0 &&
# git push origin v1.0.0`) or run manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # The three build jobs run in parallel, and each one asked tauri-action to
  # find-or-create the draft release for this tag. When two looked before
  # either had created one, both created their own and the artifacts split
  # across a pair of drafts — which is how v1.1.0 first shipped empty.
  #
  # So the release is created exactly once, here, and every build job uploads
  # into that specific id. Nothing downstream resolves a release by tag.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      # A failed run leaves its half-filled release behind, and there may be
      # more than one, so delete every release carrying this tag rather than
      # whichever a tag lookup happens to resolve to. The tag is untouched.
      - name: Clear any stale releases for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '.[] | select(.tag_name == "${{ github.ref_name }}") | .id' \
          | while read -r id; do
              echo "Deleting stale release $id"
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
            done

      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/releases" \
                 -f tag_name="${{ github.ref_name }}" \
                 -f name="TerCTL ${{ github.ref_name }}" \
                 -f body='Download the installer for your OS below. AppImage (Linux) runs directly — chmod +x and launch.' \
                 -F draft=true -F prerelease=false \
                 --jq '.id')
          echo "Created draft release $id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal (Apple Silicon + Intel) → .dmg + .app
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          # Linux (Ubuntu 22.04) → .AppImage + .deb
          - platform: ubuntu-22.04
            args: ''
          # Windows → .msi + .exe
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            curl wget file libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS needs both arches for the universal build
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — sign artifacts and generate latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Upload into the one release `prepare` made. Passing a tag instead
          # lets each parallel job create its own draft — see the note there.
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }} --verbose


      - name: Upload WiX sources on failure
        if: failure() && matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: wix-debug
          path: src-tauri/target/release/wix/**
          if-no-files-found: warn
          retention-days: 7


  publish:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Three green build jobs is not proof the artifacts landed. A healthy
      # release carries ~14 assets across the platforms, so under 10 means
      # something went missing — fail loudly rather than publish a release the
      # updater cannot read, since its endpoint is
      # releases/latest/download/latest.json.
      - name: Verify the artifacts are attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh api "repos/${{ github.repository }}/releases/${{ needs.prepare.outputs.release_id }}" \
                    --jq '.assets | length')
          echo "Found $count assets on release ${{ needs.prepare.outputs.release_id }}."
          if [ "$count" -lt 10 ]; then
            echo "::error::Refusing to publish ${{ github.ref_name }} with only $count assets."
            exit 1
          fi
          gh api "repos/${{ github.repository }}/releases/${{ needs.prepare.outputs.release_id }}" \
            --jq '.assets[].name' | sort

      # By id, not by tag — a tag lookup is what published the wrong object
      # the first time around.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH \
            "repos/${{ github.repository }}/releases/${{ needs.prepare.outputs.release_id }}" \
            -F draft=false --jq '"published: \(.html_url)"'
