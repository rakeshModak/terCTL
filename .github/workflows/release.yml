name: Release

# Builds installers for macOS, Linux, and Windows and attaches them to a draft
# GitHub Release. Trigger by pushing a version tag (e.g. `git tag v1.0.0 &&
# git push origin v1.0.0`) or run manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # A failed run leaves its half-filled release behind. If a later run for the
  # same tag then finds two release objects sharing that tag, the publish step
  # below can resolve to the wrong one and the artifacts are lost with the
  # draft. Clearing first guarantees the matrix builds into a single, fresh
  # release. The tag itself is untouched.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clear any stale release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ github.ref_name }}" \
            --yes --repo "${{ github.repository }}" || true

  release:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal (Apple Silicon + Intel) → .dmg + .app
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          # Linux (Ubuntu 22.04) → .AppImage + .deb
          - platform: ubuntu-22.04
            args: ''
          # Windows → .msi + .exe
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            curl wget file libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS needs both arches for the universal build
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — sign artifacts and generate latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'TerCTL ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your OS below. AppImage (Linux) runs directly — chmod +x and launch.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --verbose


      - name: Upload WiX sources on failure
        if: failure() && matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: wix-debug
          path: src-tauri/target/release/wix/**
          if-no-files-found: warn
          retention-days: 7


  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Every job reporting success is not proof the artifacts landed — they
      # upload to a release resolved by tag, and that lookup can go wrong. A
      # healthy release carries ~14 assets across the three platforms, so
      # anything under 10 means something was lost. Fail loudly instead of
      # publishing an empty release, which would also break the updater:
      # its endpoint is releases/latest/download/latest.json.
      - name: Verify the artifacts are attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh release view "${{ github.ref_name }}" \
                    --repo "${{ github.repository }}" --json assets --jq '.assets | length')
          echo "Found $count assets on ${{ github.ref_name }}."
          if [ "$count" -lt 10 ]; then
            echo "::error::Refusing to publish ${{ github.ref_name }} with only $count assets."
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
