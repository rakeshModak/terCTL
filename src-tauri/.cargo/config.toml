# `russh` pulls in aws-lc-rs -> aws-lc-sys, whose build script assembles x86_64
# crypto primitives with NASM. NASM is not part of the Rust/MSVC toolchain, so a
# clean Windows dev box fails the build with "NASM command not found! Build
# cannot continue." before Tauri ever gets to start.
#
# aws-lc-sys ships pre-assembled .obj files for exactly this case; this flag uses
# them instead of shelling out to NASM. The assembly optimisations are kept (unlike
# AWS_LC_SYS_NO_ASM, which drops to pure C and is refused for release builds).
#
# Only read on windows-x86_64 — inert on macOS and Linux, so it is safe to set
# unconditionally here.
[env]
AWS_LC_SYS_PREBUILT_NASM = "1"
