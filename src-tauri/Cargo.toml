[package]
name = "TerCTL"
version = "1.1.1"
# `authors` becomes the Maintainer field of the .deb — it takes precedence over
# bundle.publisher in tauri.conf.json, so the placeholder that used to live here
# shipped as `Maintainer: you`.
#
# Spelled "and" rather than "&": this string also reaches the MSI Manufacturer
# field, and `main.wxs` is XML, where a bare ampersand is a parse error.
description = "Keyboard-first SSH client and terminal manager"
authors = ["Rakesh Modak and Sagar Sen"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "terctl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }
keyring = { version = "4.1.2", features = [
    "apple-native-keyring-store",
    "windows-native-keyring-store",
    "zbus-secret-service-keyring-store",
] }
tauri-plugin-dialog = "2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
rand = "0.9"
zeroize = { version = "1", features = ["derive"] }
russh = "0.62.1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "io-util", "sync", "macros", "time", "fs"] }
portable-pty = "0.9.0"
russh-sftp = "2.3.0"
tauri-plugin-clipboard-manager = "2.3.2"

